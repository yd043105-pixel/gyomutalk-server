<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교무톡 · 학교 소식</title><link rel="stylesheet" href="portal.css"><script src="/update-notice.js" defer></script><script src="/timetable.js" defer></script><link rel="stylesheet" href="/timetable.css"><script src="portal.js" defer></script><link rel="stylesheet" href="/update-notice.css"></head>
<body><header><a class="brand" href="/"><b class="mark">교</b><span>우리 학교<small>함께 여는 학교 소식</small></span></a><button id="updates" hidden>업데이트 내역</button><button id="logout" hidden>로그아웃</button></header><main>
<section id="login"><p class="eyebrow">학교에서 전하는 이야기</p><h1>우리 학교 소식</h1><p>회원가입과 약관 확인은 휴대폰 앱에서 진행하세요.</p><form id="login-form"><label>아이디<input name="username" autocomplete="username" required maxlength="32"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><label class="check"><input name="rememberLogin" type="checkbox">자동 로그인</label><button class="primary">로그인</button></form>
<details id="signup" hidden><summary>학생·학부모 회원가입</summary><form id="signup-form"><label>회원 구분<select name="role"><option value="parent">학부모</option><option value="student">학생</option></select></label><label>이름<input name="name" autocomplete="name" required maxlength="50"></label><label>새 아이디<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>새 비밀번호<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><div id="student-fields" hidden><label>학급<select name="classId"></select></label><label>출석 번호<input name="studentNumber" type="number" min="1" max="99"></label></div><p id="signup-help">학부모는 임시회원으로 가입합니다. 로그인 후 설정에서 자녀 고유번호를 입력하세요.</p><button>회원가입 신청</button></form></details>
<details hidden><summary>학교 초대 코드로 가입하기</summary><form id="register-form"><label>초대 코드<input name="code" required autocomplete="off"></label><label>새 아이디<input name="username" required minlength="3" maxlength="32" autocomplete="username"></label><label>새 비밀번호<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><p>학교에서 미리 등록한 계정이나 교직원 초대에 사용합니다.</p><button>계정 등록</button></form></details></section>
<section id="workspace" hidden><div class="heading"><div><p class="eyebrow" id="identity"></p><h1 id="title">학교 소식</h1></div><button id="refresh">새로고침</button><button id="settings" hidden>설정 · 자녀 연결</button><button id="timetable">시간표</button></div><section id="settings-content" hidden class="panel"></section><div id="admin" hidden><nav><button data-panel="people">계정·가입 승인</button><button data-panel="classes">학급</button><button data-panel="families">보호자 연결</button><button data-panel="status">연결 상태</button></nav><div id="admin-content"></div></div><section id="news" hidden><div class="filters"><label>자녀<select id="child"><option value="">전체 자녀</option></select></label><label class="check"><input type="checkbox" id="unread">미확인만</label></div><div class="columns"><div id="list"></div><article id="detail"><p>공지를 선택하세요.</p></article></div><button id="more" hidden>다음 목록</button></section></section>
</main><p id="feedback" role="status" aria-live="polite"></p><dialog id="confirm"><form method="dialog"><h2>변경 내용을 확인하세요</h2><p id="confirm-text"></p><div class="actions"><button value="cancel">취소</button><button value="ok" class="primary">변경하기</button></div></form></dialog></body></html>
