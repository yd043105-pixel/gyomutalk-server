<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교무톡 · 온라인 교무실</title><link rel="stylesheet" href="office.css"><script src="/update-notice.js" defer></script><script src="/timetable.js" defer></script><link rel="stylesheet" href="/timetable.css"><script src="office.js" defer></script><link rel="stylesheet" href="/update-notice.css"></head>
<body>
<section id="login" class="login"><div class="school-mark">교</div><p class="eyebrow">우리 학교</p><h1>온라인 교무실</h1><p class="muted">학교의 소식과 오늘의 업무를 한곳에서.</p><form id="login-form"><label>아이디<input id="username" autocomplete="username" required maxlength="50"></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary">로그인</button></form><p class="muted small">관리자가 승인한 교직원 계정으로 접속하세요.</p></section>
<div id="office" hidden><aside><div class="brand"><span class="school-mark">교</span><div>온라인 교무실<small>SCHOOL MESSENGER</small></div></div><nav aria-label="교무실 메뉴"><button data-view="received">받은 메시지</button><button data-view="sent">보낸 메시지</button><button data-view="chats">교직원 채팅</button><button data-view="surveys">설문</button><button data-view="todos">나의 할 일</button><button data-view="submissions">파일 제출</button><button id="timetable">시간표 · 내 수업</button></nav><div class="account"><span id="identity"></span><button id="updates">업데이트 내역</button><button id="logout">로그아웃</button></div></aside><main><header><div><p class="eyebrow" id="school-name">우리 학교</p><h1 id="heading">받은 메시지</h1></div><button id="refresh">새로고침</button></header><div class="toolbar"><p id="hint" class="muted">학교 안에서 업무를 확인하세요.</p><button id="add-todo" hidden>할 일 직접 추가</button></div><div class="workspace"><section id="list" aria-label="목록"></section><section id="detail" aria-label="상세 내용"><div class="empty">목록에서 항목을 선택하세요.</div></section></div><button id="more" hidden>다음 목록</button></main></div>
<p id="feedback" role="status" aria-live="polite"></p>
</body></html>
